name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -v
      - run: python tools/run_corpus.py
      - run: splatcheck --help
  comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python tools/compare.py --output docs/comparison.json
      - uses: actions/upload-artifact@v7
        with:
          name: khronos-comparison
          path: docs/comparison.json
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate a minimal valid asset
        run: python -c "from pathlib import Path; from tests.assets import make_glb; Path('valid.glb').write_bytes(make_glb())"
      - name: Run the repository action
        uses: ./
        with:
          files: valid.glb
          format: json
          report: action-report.json
      - name: Verify the action report
        run: python -c "import json; report=json.load(open('action-report.json')); assert report['results'][0]['status'] == 'pass'"


