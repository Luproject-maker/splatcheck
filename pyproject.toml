[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "splatcheck"
version = "0.1.0"
description = "CPU-only Gaussian Splatting asset checks and regression corpus"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
keywords = ["gaussian-splatting", "3dgs", "gltf", "ply", "validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/Luproject-maker/splatcheck"
Issues = "https://github.com/Luproject-maker/splatcheck/issues"
Changelog = "https://github.com/Luproject-maker/splatcheck/blob/main/CHANGELOG.md"

[project.scripts]
splatcheck = "splatcheck.__main__:main"

[tool.setuptools.packages.find]
include = ["splatcheck*"]

